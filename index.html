    body {
      font-family: var(--font-sans), sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* Fix for browser autofill styles */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px var(--secondary) inset !important;
        -webkit-text-fill-color: var(--text-primary) !important;
        caret-color: var(--text-primary) !important;
    }
    /* Custom Scrollbar for Webkit browsers (Chrome, Safari) */
    .freeboard-scrollbar::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .freeboard-scrollbar::-webkit-scrollbar-track {
      background: var(--secondary);
      border-radius: 4px;
    }
    .freeboard-scrollbar::-webkit-scrollbar-thumb {
      background-color: var(--text-secondary);
      border-radius: 4px;
      border: 2px solid var(--secondary);
    }
    .freeboard-scrollbar::-webkit-scrollbar-thumb:hover {
      background-color: var(--primary);
    }
    /* Custom Scrollbar for Firefox */
    .freeboard-scrollbar {
      scrollbar-width: thin;
      scrollbar-color: var(--text-secondary) var(--secondary);
    }
